<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>M&L Pastel Delivery - Cardápio Digital</title>
    <style>
        :root {
            --gold: #f5a623;
            --gold-dark: #d48806;
            --black-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html { background-color: #000; color-scheme: dark; }
        body {
            background-color: var(--black-bg);
            color: var(--text-light);
            padding-bottom: 120px;
        }

        header {
            background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
            border-bottom: 2px solid var(--gold);
            padding: 24px 16px;
            text-align: center;
        }

        .logo-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            margin-top: -5px;
        }

        .tagline {
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .nav-tabs {
            display: flex;
            background: #181818;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: rgba(245, 166, 35, 0.05);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ACCORDION / CAMADAS */
        .accordion-item {
            margin-bottom: 12px;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--card-bg);
        }

        .accordion-header {
            width: 100%;
            background: #252525;
            color: var(--gold);
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 12px;
            background: #181818;
        }

        .accordion-item.active .accordion-body {
            padding: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .item-price {
            color: var(--gold);
            font-weight: bold;
            margin-top: 6px;
            font-size: 1.05rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background-color: var(--gold);
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marmita-box {
            background: #1a1813;
            border: 1px solid var(--gold);
            padding: 18px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .status-banner {
            background: rgba(245, 166, 35, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .marmita-options {
            display: flex;
            gap: 10px;
            margin: 14px 0;
        }

        .marmita-btn {
            flex: 1;
            background: #252525;
            border: 2px solid #444;
            padding: 14px 10px;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .marmita-btn.active {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.2);
            color: var(--gold);
        }

        /* ESTILIZAÇÃO DOS BOTÕES DE PRATOS E ACOMPANHAMENTOS (ACESSIBILIDADE / IDOSOS) */
        .section-subtitle {
            font-size: 1.15rem;
            color: var(--gold);
            margin: 16px 0 10px;
            font-weight: bold;
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 2px solid #3d3d3d;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .checkbox-item span.item-text {
            font-size: 1.25rem; /* Fonte aumentada para leitura clara */
            font-weight: bold;
            color: #ffffff;
        }

        .checkbox-item input {
            display: none; /* Oculta o checkbox padrão pequeno */
        }

        /* Caixa de Seleção Personalizada Grandinha */
        .custom-check {
            width: 28px;
            height: 28px;
            border: 2px solid var(--gold);
            border-radius: 6px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .custom-check::after {
            content: '✓';
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            display: none;
        }

        .checkbox-item input:checked + .custom-check {
            background: var(--gold);
        }

        .checkbox-item input:checked + .custom-check::after {
            display: block;
        }

        .checkbox-item:has(input:checked) {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.15);
        }

        /* ===== POPUP DE ENTREGA: cabe na area visivel (acima do teclado), botoes sempre a vista ===== */
        #entrega-modal {
            align-items: center;
            overflow: hidden;
            padding: 6px 0;
            box-sizing: border-box;
        }
        #entrega-modal .custom-modal {
            display: flex;
            flex-direction: column;
            width: 92%;
            max-width: 420px;
            max-height: calc(100% - 4px) !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            text-align: left;
        }
        #entrega-modal .em-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 18px 18px 4px;
        }
        #entrega-modal .em-foot {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 10px 18px 14px;
            border-top: 1px solid #333;
            background: #1e1e1e;
        }
        #entrega-modal .form-group { margin-bottom: 14px; }
        #entrega-modal .form-group label { margin-bottom: 6px; }
        #entrega-modal .form-section-title { margin: 0 0 14px; }
        #entrega-modal .em-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
        #entrega-modal .em-row.troco-on { grid-template-columns: 1.2fr 1fr; }
        #entrega-modal .em-row .form-group { margin: 0; min-width: 0; }
        #entrega-modal .em-foot .modal-btn { flex: 1; width: auto; padding: 13px 10px; }

        /* teclado aberto: modo compacto (mesmo visual, menos espaco vazio) */
        #entrega-modal.kb .em-body { padding: 10px 14px 2px; }
        #entrega-modal.kb .form-section-title { font-size: .95rem; margin-bottom: 8px; padding-bottom: 4px; }
        #entrega-modal.kb .form-group, #entrega-modal.kb .em-row { margin-bottom: 8px; }
        #entrega-modal.kb .form-group label { font-size: .85rem; margin-bottom: 3px; }
        #entrega-modal.kb .form-group input,
        #entrega-modal.kb .form-group select,
        #entrega-modal.kb .form-group textarea { padding: 8px 10px; }
        #entrega-modal.kb .form-group textarea { min-height: 0; }
        #entrega-modal.kb .em-foot { padding: 8px 14px 10px; }
        #entrega-modal.kb .em-foot .modal-btn { padding: 11px 8px; }

        .form-group label.checkbox-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0;
        }

        .btn-add-marmita {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .form-section-title {
            font-size: 1.2rem;
            color: var(--gold);
            border-bottom: 1px solid var(--gold);
            padding-bottom: 6px;
            margin: 24px 0 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
            color: #ddd;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid var(--gold);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            z-index: 2147483647 !important;
            gap: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-order {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* MODAL PERSONALIZADO */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal {
            background: #1e1e1e;
            border: 2px solid var(--gold);
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(245, 166, 35, 0.25);
        }

        .modal-logo {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 2.2rem;
            color: var(--gold);
            line-height: 1;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .modal-message {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        /* REMOVE ELEMENTOS NETLIFY */
        #netlify-badge, .netlify-badge, iframe[src*="netlify"],
        [class*="netlify"], [id*="netlify"], net-lify, netlify-drawer {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }
    .off{opacity:.4;pointer-events:none}

        </div>
        <div class="tagline">— SABOR QUE VIRA PAIXÃO! —</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">

    <div class="nav-tabs">

    <div id="status-cozinha" class="status-banner" style="display:none;margin:12px 16px 0"></div>
    <div class="container">

        <!-- ABA 1: PASTEIS E SANDUÍCHES -->
        <div id="tab-lanches" class="tab-content active"><div id="cats"></div></div>

        <!-- ABA 2: MARMITAS -->
        <div id="tab-marmitas" class="tab-content">
            <div id="status-marmita" class="status-banner"></div>

            <div id="box-marmita" class="marmita-box">
                <h3 style="font-size: 1.3rem; color: var(--gold); text-align: center;">Montar Marmita</h3>
                
                <div class="marmita-options">
                    <button type="button" class="marmita-btn active" id="btn-1-opcao" onclick="selecionarTipoMarmita(1, 18)">1 Opção - R$ 18,00</button>
                    <button type="button" class="marmita-btn" id="btn-2-opcoes" onclick="selecionarTipoMarmita(2, 20)">2 Opções - R$ 20,00</button>
                </div>

                <div class="form-group">
                    <div class="section-subtitle">Prato Principal:</div>
<div class="grid-options" id="lista-pratos"></div>
</div>
<div class="form-group">
<div class="section-subtitle">Acompanhamentos:</div>
<div class="grid-options" id="lista-acomp"></div>
</div>
<button type="button" id="btn-add-marmita-el" class="btn-add-marmita" onclick="addMarmita()">Adicionar Marmita ao Pedido</button>
            </div>
        </div>

        

    </div>

    <!-- MODAL ENTREGA -->
    <div id="entrega-modal" class="custom-modal-overlay" style="z-index:999990">
        <div class="custom-modal">
            <div class="em-body">
                <h2 class="form-section-title">Dados para Entrega</h2>
                <div class="form-group">
                    <label for="name">Nome do Cliente:</label>
                    <input type="text" id="name" placeholder="Ex: João Silva" autocomplete="name" enterkeyhint="next">
                </div>
                <div class="form-group">
                    <label for="address">Endereço Completo de Entrega:</label>
                    <textarea id="address" rows="2" placeholder="Rua, número, bairro e ponto de referência" autocomplete="street-address"></textarea>
                </div>
                <div class="em-row" id="pay-row">
                    <div class="form-group">
                        <label for="payment">Forma de Pagamento:</label>
                        <select id="payment" onchange="togglePaymentInfo(true)">
                            <option value="Pix">Pix</option>
                            <option value="Cartão">Cartão (Pagamento no ato da entrega)</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    <div class="form-group" id="troco-group" style="display: none;">
                        <label for="troco">Troco para:</label>
                        <input type="text" id="troco" inputmode="decimal" placeholder="R$ 50,00" enterkeyhint="done">
                    </div>
                </div>
            </div>
            <div class="em-foot">
                <button class="modal-btn" style="background:#444;color:#fff" onclick="fecharEntrega()">Voltar</button>
                <button class="modal-btn" onclick="enviarPedido()">Enviar pedido</button>
            </div>
        </div>
    </div>

    <!-- MODAL PERSONALIZADO -->
    <div id="custom-modal" class="custom-modal-overlay" style="z-index:2147483647">
        <div class="custom-modal">
            <div class="modal-logo ml-logo" role="img" aria-label="M&L" style="height:2.6rem;width:6.99rem;margin:0 auto"></div>
            <div class="modal-subtitle">Lanches</div>
            <div class="modal-message" id="modal-msg-text">Mensagem...</div>
            <button id="modal-ok" class="modal-btn" onclick="closeCustomAlert()">OK</button>
            <button id="modal-cancel" class="modal-btn" style="display:none;margin-top:8px;background:#444;color:#fff" onclick="closeCustomAlert()">Cancelar</button>
        </div>
    </div>

    <div class="footer-cart">
        <div>
            <span style="font-size: 0.8rem; color: #aaa;">Total:</span>
            <div style="color: var(--gold); font-size: 1.2rem; font-weight: bold;" id="total-display">R$ 0,00</div>
        </div>
        <div class="action-buttons">
            <button class="btn-reset" onclick="novoPedido()">Novo Pedido</button>
            <button class="btn-order" onclick="sendOrder()">Finalizar</button>
        </div>

    <script>
        const removerSeloNetlify = () => {
            const seletores = ['#netlify-badge', '.netlify-badge', 'iframe[src*="netlify"]', '[class*="netlify"]', '[id*="netlify"]', 'net-lify', 'netlify-drawer'];
            seletores.forEach(s => document.querySelectorAll(s).forEach(el => el.remove()));
        };
        const observer = new MutationObserver(removerSeloNetlify);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removerSeloNetlify);
        window.addEventListener('load', removerSeloNetlify);

        function showCustomAlert(msg) {
            document.getElementById('modal-msg-text').innerText = msg;
            document.getElementById('modal-cancel').style.display = 'none';
            document.getElementById('modal-ok').onclick = closeCustomAlert;
            document.getElementById('custom-modal').classList.add('active');
        }

        function closeCustomAlert() {
            document.getElementById('custom-modal').classList.remove('active');
            document.getElementById('modal-cancel').style.display = 'none';
            document.getElementById('modal-ok').onclick = closeCustomAlert;
        }

        function confirmar(msg, cb) {
            document.getElementById('modal-msg-text').innerText = msg;
            document.getElementById('modal-cancel').style.display = 'block';
            document.getElementById('modal-ok').onclick = function () { closeCustomAlert(); cb(); };
            document.getElementById('custom-modal').classList.add('active');

async function poll(){try{const j=await api('ver');E=j.estado;P=j.pedidos;chk();['lanches','marmitas'].forEach(k=>{if(!E[k].aberta&&j.ultimo&&j.ultimo[k])R[k]=j.ultimo[k]});rK();rS();rP();rel(R[K])}catch(e){}}
function draw(){rK();rS();rM();rP();rel(R[K])}
function setK(k){K=k;draw()}
function aba(n){[1,2,3].forEach(i=>{$('t'+i).hidden=i!=n;document.querySelectorAll('.tabs button')[i-1].className=i==n?'on':''})}
const pend=k=>P[k].filter(o=>o.status!=='feito'),st=k=>!E[k].aberta?'fechada':E[k].pausada?'pausada':'aberta';
const dia=d=>new Date(d).toDateString(),tot=k=>{const e=E[k];return e.ini&&dia(e.ini)==dia(new Date())?P[k].filter(o=>o.status==='feito').reduce((a,o)=>a+o.total,0):0};
function rK(){['lanches','marmitas'].forEach(k=>{const n=pend(k).length;$('k_'+k).className=k==K?'b':'k';$('k_'+k).innerHTML=(k=='lanches'?'🥟 Lanches':'🍱 Marmitas')+'<br><b style="font-size:1.15rem">'+brl(tot(k))+'</b><br><small style="color:inherit">'+st(k)+(n?' · '+n+' pend.':'')+'</small>'})}
function rS(){const e=E[K],a=e.aberta,p=e.pausada;$('stt').style.background=!a?'#444':p?'#b26a00':'#1b5e20';$('stt').textContent='COZINHA DE '+K.toUpperCase()+(!a?' FECHADA':p?' PAUSADA':' ABERTA');
$('ctl').innerHTML=!a?'<button class="v" onclick="est(\'abrir\')">Abrir cozinha</button>':`<button class="b" onclick="est('${p?'retomar':'pausar'}')">${p?'Retomar produção':'Pausar produção'}</button><button class="r" onclick="fechar()">Fechar o dia</button>`}
async function est(x){const j=await api('estado',{x,k:K});E=j.estado;rK();rS();poll()}
function fechar(){const n=pend(K).length;confirmar(n?`Há ${n} pedido(s) pendente(s). Serão finalizados e incluídos no relatório. Fechar a cozinha de ${K}?`:`Fechar a cozinha de ${K} e gerar o relatório?`,async()=>{const j=await api('estado',{x:'fechar',k:K});E=j.estado;R[K]=j.relatorio;P[K]=P[K].map(o=>({...o,status:'feito'}));rK();rS();rP();per='fech';rel();aba(3)})}
function rM(){const mm=K=='marmitas';$('t1').innerHTML=(mm?'<div class="card"><small>Cadastre os alimentos e toque em <b>Liberar</b> nos que entram nos pratos de hoje. Só os liberados aparecem para o cliente.</small></div>':'')+M.cats.filter(c=>mm?c.tipo:!c.tipo).map(c=>`<details ${op.has(c.id)?'open':''} ontoggle="tg(this,'${c.id}')"><summary>${c.nome}${c.tipo?' · '+c.itens.filter(i=>i.lib).length+' liberados':''}</summary>${c.itens.map((i,k)=>row(c,i,k)).join('')}<div class="it" style="background:#181818"><input class="n" id="nn${c.id}" placeholder="Novo item">${c.tipo?'':`<input class="p" id="np${c.id}" type="number" step="0.5" placeholder="R$"><input class="d" id="nd${c.id}" placeholder="Descrição (opcional)">`}<button class="b" onclick="add('${c.id}')">+</button></div></details>`).join('')+(mm?`<button class="k" style="width:100%;margin-bottom:10px" onclick="limpar()">Desmarcar todos os liberados</button><div class="card"><b>Preço da marmita</b><div class="row"><div><small>1 opção</small><input type="number" value="${M.p1}" onchange="setP(1,this.value)"></div><div><small>2 opções</small><input type="number" value="${M.p2}" onchange="setP(2,this.value)"></div></div></div>`:'')}
const row=(c,i,k)=>c.tipo?`<div class="it"><input class="n" value="${esc(i.name)}" onchange="ed('${c.id}',${k},'name',this.value)"><button class="${i.lib?'v':'k'}" onclick="lib('${c.id}',${k})">${i.lib?'✔ Liberado':'Liberar'}</button><button class="r" onclick="del('${c.id}',${k})">✕</button></div>`:`<div class="it ${i.pausado?'off':''}"><input class="n" value="${esc(i.name)}" onchange="ed('${c.id}',${k},'name',this.value)"><input class="p" type="number" step="0.5" value="${i.price}" onchange="ed('${c.id}',${k},'price',+this.value)"><button class="k" onclick="ps('${c.id}',${k})">${i.pausado?'▶':'⏸'}</button><button class="r" onclick="del('${c.id}',${k})">✕</button><input class="d" value="${esc(i.desc)}" placeholder="descrição" onchange="ed('${c.id}',${k},'desc',this.value)"></div>`;
const cat=id=>M.cats.find(c=>c.id==id);
function ed(c,k,f,v){cat(c).itens[k][f]=v;sv()}
function ps(c,k){const i=cat(c).itens[k];i.pausado=!i.pausado;rM();sv()}
function lib(c,k){const i=cat(c).itens[k];i.lib=!i.lib;rM();sv()}
function limpar(){M.cats.filter(c=>c.tipo).forEach(c=>c.itens.forEach(i=>i.lib=false));rM();sv()}
function del(c,k){confirmar('Excluir este item?',()=>{cat(c).itens.splice(k,1);rM();sv()})}
function add(c){const n=$('nn'+c).value.trim();if(!n)return;const ct=cat(c),id=Math.max(0,...M.cats.flatMap(x=>x.itens.map(i=>i.id||0)))+1;
ct.itens.push(ct.tipo?{id,name:n,lib:false}:{id,name:n,desc:$('nd'+c).value.trim(),price:+$('np'+c).value||0});op.add(c);rM();sv()}
function sv(){clearTimeout(T);$('sv').textContent='Salvando...';T=setTimeout(async()=>{try{await api('menu',{menu:M});$('sv').textContent='Salvo ✓'}catch(e){$('sv').textContent='Erro ao salvar'}},600)}
function rP(){const L=pend(K);$('t2').innerHTML=L.length?L.slice().reverse().map(o=>`<div class="card" style="display:flex;gap:10px;align-items:center"><div style="flex:1;min-width:0"><b>${o.cliente}</b> · ${new Date(o.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}<br><small>${o.endereco}</small><br>${o.itens.map(i=>i.q+'x '+i.n).join('<br>')}<br><b style="color:var(--g)">${brl(o.total)}</b> <small>${o.pag}</small></div><button class="v" title="Finalizado" aria-label="Finalizado" style="flex:none;width:48px;height:48px;border-radius:50%;padding:0;font-size:1.4rem" onclick="fin('${o.id}')">✓</button></div>`).join(''):'<p>Nenhum pedido pendente.</p>'}
async function fin(id){const j=await api('finalizar',{id,k:K});P[K]=j.pedidos;rK();rP();R[K]=(await api('relatorio',{k:K})).relatorio;rel(R[K])}
function relFech(r){return (r?`<div class="card"><b>Relatório de ${K}</b><br><small>${new Date(r.ini).toLocaleString()} até ${new Date(r.fim).toLocaleString()}</small><br>${r.auto?'<small>Fechado automaticamente à meia-noite</small><br>':''}<small>Total de vendas</small><h2 style="color:var(--g)">${brl(r.total)}</h2>${r.n} pedidos · ticket médio ${brl(r.n?r.total/r.n:0)}</div><div class="card"><b>Por pagamento</b>${Object.entries(r.pag).map(([k,v])=>`<br>${k}: ${brl(v)}`).join('')}</div><div class="card"><b>Itens vendidos</b>${r.itens.map(i=>`<br>${i.q}x ${i.n} <small>${brl(i.v)}</small>`).join('')}</div><div class="card"><b>Pedidos finalizados</b>${(r.lista||[]).map(o=>`<br>${new Date(o.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${o.cliente} · ${o.pag} · ${brl(o.total)}`).join('')}</div><button class="v" style="width:100%;margin-bottom:10px" onclick="zap()">Enviar por WhatsApp</button>`:'<p>Nenhum relatório ainda.</p>')}
const HK='mlhist',DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],PER=[['parcial','Parcial do turno'],['hoje','Hoje'],['7','7 dias'],['30','30 dias'],['tudo','Tudo'],['fech','Último fechamento']];
let H={},per='parcial',lastTxt='';
try{H=JSON.parse(localStorage.getItem(HK)||'{}')||{}}catch(e){H={}}
function merge(){let ch=false;['lanches','marmitas'].forEach(k=>(P[k]||[]).forEach(o=>{if(!o||!o.id)return;const key=k+':'+o.id,x=H[key];if(!x||x.st!==o.status||(!x.it&&o.itens)){H[key]={k:k,ts:o.ts,pag:o.pag,st:o.status,it:o.itens};ch=true}}));if(ch)try{localStorage.setItem(HK,JSON.stringify(H))}catch(e){}}
async function histRemoto(){try{const j=await api('historico');if(!Array.isArray(j.pedidos))return;j.pedidos.forEach(o=>{const k=String(o.sessao||'')[0]==='m'?'marmitas':'lanches';H[k+':'+o.id]={k:k,ts:o.ts,pag:o.pag,st:o.status,it:o.itens}});try{localStorage.setItem(HK,JSON.stringify(H))}catch(e){}}catch(e){}}
async function setPer(p){per=p;rel();if(p!=='parcial'&&p!=='fech'){await histRemoto();rel()}}
function lista(){if(per==='parcial'){const e=E[K];if(!e.aberta)return null;return (P[K]||[]).filter(o=>!e.ini||new Date(o.ts)>=new Date(e.ini)).map(o=>({ts:o.ts,pag:o.pag,it:o.itens}))}
const now=Date.now(),lim=per==='7'?now-6048e5:per==='30'?now-2592e6:0;
return Object.values(H).filter(x=>x.k===K&&(per==='tudo'||(per==='hoje'?dia(x.ts)==dia(now):new Date(x.ts)>=lim)))}
function calc(L){const r={n:0,tot:0,pag:{},it:{},pr:{},ac:{},tp:{},wd:[0,0,0,0,0,0,0],wv:[0,0,0,0,0,0,0],hr:{},mq:0,sa:0};
L.forEach(x=>{const its=(x.it||[]).filter(i=>!i.k||i.k===K);if(!its.length)return;const v=its.reduce((a,i)=>a+i.q*i.p,0),d=new Date(x.ts);r.n++;r.tot+=v;r.pag[x.pag]=(r.pag[x.pag]||0)+v;r.wd[d.getDay()]++;r.wv[d.getDay()]+=v;r.hr[d.getHours()]=(r.hr[d.getHours()]||0)+1;
its.forEach(i=>{if(K==='lanches'){const z=r.it[i.n]||(r.it[i.n]={q:0,v:0});z.q+=i.q;z.v+=i.q*i.p}else{r.mq+=i.q;const m=/^Marmita \((.*?)\):\s*(.*)$/.exec(i.n);if(!m)return;const pa=m[2].split(' | Acomp: ');r.tp[m[1]]=(r.tp[m[1]]||0)+i.q;pa[0].split(' + ').forEach(p=>r.pr[p]=(r.pr[p]||0)+i.q);if(pa[1])pa[1].split(', ').forEach(c=>r.ac[c]=(r.ac[c]||0)+i.q);else r.sa+=i.q}})});return r}
const arr=(o,f)=>Object.entries(o).map(([n,z])=>f?{n,q:z.q,v:z.v}:{n,q:z}).sort((a,b)=>b.q-a.q);
function rk(t,a,tq){if(!a.length)return '';const mx=a[0].q;return `<div class="card"><b>${t}</b>${a.map(x=>`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px"><span>${x.n}</span><span><b>${x.q}</b>${x.v!=null?' · '+brl(x.v):''} <small>${Math.round(x.q/tq*100)}%</small></span></div><div style="height:6px;background:#333;border-radius:4px;margin-top:3px"><div style="width:${Math.max(3,x.q/mx*100)}%;height:100%;background:var(--g);border-radius:4px"></div></div></div>`).join('')}</div>`}
function zapTxt(){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(lastTxt),'_blank')}
function rel(){const chips=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${PER.map(([k,n])=>`<button class="${per==k?'b':'k'}" style="flex:none;padding:8px 12px;font-size:.85rem" onclick="setPer('${k}')">${n}</button>`).join('')}</div>`;
if(per==='fech'){$('t3').innerHTML=chips+relFech(R[K]);return}
const nome=PER.find(p=>p[0]==per)[1],L=lista();
if(L===null){$('t3').innerHTML=chips+'<div class="card">Nenhum turno em andamento. A cozinha de '+K+' está fechada. Abra a cozinha para ver a parcial, ou escolha um período acima.</div>';return}
const r=calc(L);
if(!r.n){$('t3').innerHTML=chips+'<div class="card">Nenhum pedido em <b>'+nome+'</b> na cozinha de '+K+'.</div>';return}
let h=`<div class="card"><b>${K==='lanches'?'Lanches':'Marmitas'} · ${nome}</b><br><small>Total de vendas</small><h2 style="color:var(--g)">${brl(r.tot)}</h2>${r.n} pedidos · ticket médio ${brl(r.tot/r.n)}</div>`;
let t=`*RELATÓRIO M&L (${K}) - ${nome}*\n\n*Vendas:* ${brl(r.tot)}\n*Pedidos:* ${r.n}\n`;
if(K==='lanches'){const a=arr(r.it,1),tq=a.reduce((s,x)=>s+x.q,0);h+=rk('Mais vendidos por sabor',a,tq);t+='\n*Por sabor*\n'+a.map(x=>x.q+'x '+x.n).join('\n');
const vend=new Set(a.map(x=>x.n)),sem=(M.cats||[]).filter(c=>!c.tipo).flatMap(c=>c.itens).map(i=>i.name).filter(n=>!vend.has(n));
if(sem.length&&per!=='parcial')h+=`<div class="card"><b>Sem nenhuma venda no período</b><br><small>${sem.join(' · ')}</small></div>`}
else{h+=rk('Tipos de marmita',arr(r.tp),r.mq);const pr=arr(r.pr),ac=arr(r.ac);h+=rk('Pratos principais',pr,pr.reduce((s,x)=>s+x.q,0));h+=rk('Acompanhamentos',ac,r.mq-r.sa||1);
if(r.sa)h+=`<div class="card"><small>${r.sa} marmita(s) sem acompanhamento registrado (pedidos antigos ou sem escolha).</small></div>`;
t+='\n*Pratos*\n'+pr.map(x=>x.q+'x '+x.n).join('\n')+'\n\n*Acompanhamentos*\n'+ac.map(x=>x.q+'x '+x.n).join('\n');
const vend=new Set(Object.keys(r.pr).concat(Object.keys(r.ac))),sem=(M.cats||[]).filter(c=>c.tipo).flatMap(c=>c.itens).filter(i=>i.lib).map(i=>i.name).filter(n=>!vend.has(n));
if(sem.length&&per!=='parcial')h+=`<div class="card"><b>Liberados sem nenhuma venda</b><br><small>${sem.join(' · ')}</small></div>`}
h+=`<div class="card"><b>Por pagamento</b>${Object.entries(r.pag).map(([k,v])=>`<br>${k}: ${brl(v)}`).join('')}</div>`;
if(per==='7'||per==='30'||per==='tudo'){const mx=Math.max(...r.wd,1);h+=`<div class="card"><b>Pedidos por dia da semana</b>${r.wd.map((q,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="width:34px">${DS[i]}</span><div style="flex:1;height:8px;background:#333;border-radius:4px"><div style="width:${q/mx*100}%;height:100%;background:var(--g);border-radius:4px"></div></div><span style="width:90px;text-align:right"><b>${q}</b> · ${brl(r.wv[i])}</span></div>`).join('')}</div>`;
const hs=Object.entries(r.hr).sort((a,b)=>b[1]-a[1]).slice(0,3);h+=`<div class="card"><b>Horários de pico</b>${hs.map(([hh,q])=>`<br>${hh}h às ${+hh+1}h: ${q} pedidos`).join('')}</div>`}
lastTxt=t;h+='<button class="v" style="width:100%;margin-bottom:10px" onclick="zapTxt()">Enviar por WhatsApp</button>';
$('t3').innerHTML=chips+h}
function parcial(){setPer('parcial')}
function zap(){const r=R[K];let t=`*RELATÓRIO M&L PASTEL (${K})*\n${new Date(r.ini).toLocaleDateString()}\n\n*Total de vendas:* ${brl(r.total)}\n*Pedidos:* ${r.n}\n\n`+Object.entries(r.pag).map(([k,v])=>`${k}: ${brl(v)}`).join('\n')+'\n\n*Itens*\n'+r.itens.map(i=>`${i.q}x ${i.n}`).join('\n');window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(t),'_blank')}

function tg(el,id){el.open?op.add(id):op.delete(id)}
function setP(n,v){M['p'+n]=+v;sv()}
function abrirAdmin(){$('adm').classList.add('on');document.body.style.overflow='hidden';if(pin&&!ativo)entrar(true)}
function fecharAdmin(){$('adm').classList.remove('on');document.body.style.overflow='';if(typeof carregar=='function')carregar()}
function sair(){confirmar('Sair do painel neste aparelho?',()=>{ls.set(pin='');ativo=false;clearInterval(iv);$('pin').value='';$('lg').hidden=false})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ativo)poll()});
Object.assign(window,{setPer,zapTxt,sino,abrirAdmin,fecharAdmin,sair,entrar,setK,aba,est,fechar,ed,ps,lib,limpar,del,add,fin,parcial,zap,tg,setP});
})();
</script>
