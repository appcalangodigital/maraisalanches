<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>M&L Pastel Delivery - Cardápio Digital</title>
    <style>
        :root {
            --gold: #f5a623;
            --gold-dark: #d48806;
            --black-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html { background-color: #000; color-scheme: dark; }
        body {
            background-color: var(--black-bg);
            color: var(--text-light);
            padding-bottom: 120px;
        }

        header {
            background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
            border-bottom: 2px solid var(--gold);
            padding: 24px 16px;
            text-align: center;
        }

        .logo-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            margin-top: -5px;
        }

        .tagline {
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .nav-tabs {
            display: flex;
            background: #181818;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: rgba(245, 166, 35, 0.05);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ACCORDION / CAMADAS */
        .accordion-item {
            margin-bottom: 12px;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--card-bg);
        }

        .accordion-header {
            width: 100%;
            background: #252525;
            color: var(--gold);
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 12px;
            background: #181818;
        }

        .accordion-item.active .accordion-body {
            padding: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .item-price {
            color: var(--gold);
            font-weight: bold;
            margin-top: 6px;
            font-size: 1.05rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background-color: var(--gold);
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marmita-box {
            background: #1a1813;
            border: 1px solid var(--gold);
            padding: 18px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .status-banner {
            background: rgba(245, 166, 35, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .marmita-options {
            display: flex;
            gap: 10px;
            margin: 14px 0;
        }

        .marmita-btn {
            flex: 1;
            background: #252525;
            border: 2px solid #444;
            padding: 14px 10px;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .marmita-btn.active {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.2);
            color: var(--gold);
        }

        /* ESTILIZAÇÃO DOS BOTÕES DE PRATOS E ACOMPANHAMENTOS (ACESSIBILIDADE / IDOSOS) */
        .section-subtitle {
            font-size: 1.15rem;
            color: var(--gold);
            margin: 16px 0 10px;
            font-weight: bold;
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 2px solid #3d3d3d;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .checkbox-item span.item-text {
            font-size: 1.25rem; /* Fonte aumentada para leitura clara */
            font-weight: bold;
            color: #ffffff;
        }

        .checkbox-item input {
            display: none; /* Oculta o checkbox padrão pequeno */
        }

        /* Caixa de Seleção Personalizada Grandinha */
        .custom-check {
            width: 28px;
            height: 28px;
            border: 2px solid var(--gold);
            border-radius: 6px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .custom-check::after {
            content: '✓';
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            display: none;
        }

        .checkbox-item input:checked + .custom-check {
            background: var(--gold);
        }

        .checkbox-item input:checked + .custom-check::after {
            display: block;
        }

        .checkbox-item:has(input:checked) {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.15);
        }

        /* ===== POPUP DE ENTREGA: cabe na area visivel (acima do teclado), botoes sempre a vista ===== */
        #entrega-modal {
            align-items: center;
            overflow: hidden;
            padding: 6px 0;
            box-sizing: border-box;
        }
        #entrega-modal .custom-modal {
            display: flex;
            flex-direction: column;
            width: 92%;
            max-width: 420px;
            max-height: calc(100% - 4px) !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            text-align: left;
        }
        #entrega-modal .em-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 18px 18px 4px;
        }
        #entrega-modal .em-foot {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 10px 18px 14px;
            border-top: 1px solid #333;
            background: #1e1e1e;
        }
        #entrega-modal .form-group { margin-bottom: 14px; }
        #entrega-modal .form-group label { margin-bottom: 6px; }
        #entrega-modal .form-section-title { margin: 0 0 14px; }
        #entrega-modal .em-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
        #entrega-modal .em-row.troco-on { grid-template-columns: 1.2fr 1fr; }
        #entrega-modal .em-row .form-group { margin: 0; min-width: 0; }
        #entrega-modal .em-foot .modal-btn { flex: 1; width: auto; padding: 13px 10px; }

        /* teclado aberto: modo compacto (mesmo visual, menos espaco vazio) */
        #entrega-modal.kb .em-body { padding: 10px 14px 2px; }
        #entrega-modal.kb .form-section-title { font-size: .95rem; margin-bottom: 8px; padding-bottom: 4px; }
        #entrega-modal.kb .form-group, #entrega-modal.kb .em-row { margin-bottom: 8px; }
        #entrega-modal.kb .form-group label { font-size: .85rem; margin-bottom: 3px; }
        #entrega-modal.kb .form-group input,
        #entrega-modal.kb .form-group select,
        #entrega-modal.kb .form-group textarea { padding: 8px 10px; }
        #entrega-modal.kb .form-group textarea { min-height: 0; }
        #entrega-modal.kb .em-foot { padding: 8px 14px 10px; }
        #entrega-modal.kb .em-foot .modal-btn { padding: 11px 8px; }

        .form-group label.checkbox-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0;
        }

        .btn-add-marmita {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .form-section-title {
            font-size: 1.2rem;
            color: var(--gold);
            border-bottom: 1px solid var(--gold);
            padding-bottom: 6px;
            margin: 24px 0 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
            color: #ddd;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid var(--gold);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            z-index: 2147483647 !important;
            gap: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-order {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* MODAL PERSONALIZADO */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal {
            background: #1e1e1e;
            border: 2px solid var(--gold);
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(245, 166, 35, 0.25);
        }

        .modal-logo {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 2.2rem;
            color: var(--gold);
            line-height: 1;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .modal-message {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        /* REMOVE ELEMENTOS NETLIFY */
        #netlify-badge, .netlify-badge, iframe[src*="netlify"],
        [class*="netlify"], [id*="netlify"], net-lify, netlify-drawer {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }
    .off{opacity:.4;pointer-events:none}
    #adm{--g:#f5a623;--c:#1e1e1e}
#adm *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
#adm{background:#121212;color:#fff;padding-bottom:40px}
#adm .hd{border-bottom:2px solid var(--g);padding:14px;text-align:center;color:var(--g);font-size:1.3rem;font-weight:bold}
#adm .w{max-width:640px;margin:0 auto;padding:14px}
#adm button{cursor:pointer;border:none;border-radius:10px;padding:12px 14px;font-weight:bold;font-size:1rem}
#adm .b{background:var(--g);color:#000}
#adm .r{background:#d32f2f;color:#fff}
#adm .v{background:#25d366;color:#fff}
#adm .k{background:#333;color:#fff}
#adm input{width:100%;padding:10px;background:#252525;border:1px solid #444;border-radius:8px;color:#fff;font-size:1rem}
#adm .st{padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
#adm .row,#adm .sw{display:flex;gap:8px;margin-bottom:10px}
#adm .row>*,#adm .sw>*{flex:1}
#adm .tabs{display:flex;border-bottom:1px solid #333;margin-bottom:12px}
#adm .tabs button{flex:1;background:none;color:#ccc;border-radius:0;border-bottom:3px solid transparent}
#adm .tabs .on{color:var(--g);border-color:var(--g)}
#adm details{background:var(--c);border:1px solid #333;border-radius:10px;margin-bottom:10px}
#adm summary{padding:14px;color:var(--g);font-weight:bold;text-transform:uppercase}
#adm .it{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid #2a2a2a}
#adm .it .n{flex:1;min-width:0}
#adm .it .p{width:84px}
#adm .it .d{flex-basis:100%;font-size:.85rem;color:#bbb}
#adm .it.off{opacity:1;pointer-events:auto}
#adm .it.off input{opacity:.4}
#adm .it.off .n{opacity:.4;text-decoration:line-through}
#adm .card{background:var(--c);border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:10px;line-height:1.5}
#adm small{color:#aaa}
#adm [hidden]{display:none!important}
#adm #lg{position:fixed;inset:0;background:#121212;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:30px;z-index:9}
#adm #sv{position:fixed;bottom:8px;right:12px;font-size:.85rem;color:#aaa}
#adm{position:fixed;inset:0;overflow-y:auto;z-index:2147483647;display:none}
#adm.on{display:block}
#btn-admin{position:absolute;top:8px;right:10px;font-size:.7rem;letter-spacing:1px;color:#777;cursor:pointer;padding:6px}
header{position:relative}
</style>
<script>var LOJ=/[?&]lojista/.test(location.search),APP=LOJ||/[?&]app=1/.test(location.search);document.write('<link rel="manifest" href="'+(APP?'manifest-lojista.json':'manifest.json')+'"><meta name="theme-color" content="'+(APP?'#000000':'#e65100')+'"><link rel="apple-touch-icon" href="'+(APP?'lojista-icon-192.png':'icon-192.png')+'"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">');if(APP)document.title='M&L Lojista'</script>
</head>
<body>

    <header>
        <a id="btn-admin" onclick="abrirAdmin()">ADMIN</a>
        <div class="logo-container">
            <div class="logo-title">M&L</div>
            <div class="logo-subtitle">Lanches</div>
        </div>
        <div class="tagline">— SABOR QUE VIRA PAIXÃO! —</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">
            <button id="btn-cli" type="button" style="display:none;padding:8px 16px;border-radius:20px;background:#ffb020;color:#000;font-size:.85rem;font-weight:bold;border:1px solid #ffb020;cursor:pointer">📲 Baixar app</button>
            <a id="btn-loj" href="?lojista=1" onclick="return baixarLoj(event)" style="display:inline-block;padding:8px 16px;border-radius:20px;background:#000;color:#ffb020;font-size:.85rem;font-weight:bold;text-decoration:none;border:1px solid #ffb020">📲 Baixar app lojista</a>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('lanches')">Pasteis e Sanduíches</button>
        <button class="tab-btn" onclick="switchTab('marmitas')">Marmitas (Almoço)</button>
    </div>

    <div id="status-cozinha" class="status-banner" style="display:none;margin:12px 16px 0"></div>
    <div class="container">

        <!-- ABA 1: PASTEIS E SANDUÍCHES -->
        <div id="tab-lanches" class="tab-content active"><div id="cats"></div></div>

        <!-- ABA 2: MARMITAS -->
        <div id="tab-marmitas" class="tab-content">
            <div id="status-marmita" class="status-banner"></div>

            <div id="box-marmita" class="marmita-box">
                <h3 style="font-size: 1.3rem; color: var(--gold); text-align: center;">Montar Marmita</h3>
                
                <div class="marmita-options">
                    <button type="button" class="marmita-btn active" id="btn-1-opcao" onclick="selecionarTipoMarmita(1, 18)">1 Opção - R$ 18,00</button>
                    <button type="button" class="marmita-btn" id="btn-2-opcoes" onclick="selecionarTipoMarmita(2, 20)">2 Opções - R$ 20,00</button>
                </div>

                <div class="form-group">
                    <div class="section-subtitle">Prato Principal:</div>
<div class="grid-options" id="lista-pratos"></div>
</div>
<div class="form-group">
<div class="section-subtitle">Acompanhamentos:</div>
<div class="grid-options" id="lista-acomp"></div>
</div>
<button type="button" id="btn-add-marmita-el" class="btn-add-marmita" onclick="addMarmita()">Adicionar Marmita ao Pedido</button>
            </div>
        </div>

        

    </div>

    <!-- MODAL ENTREGA -->
    <div id="entrega-modal" class="custom-modal-overlay" style="z-index:999990">
        <div class="custom-modal">
            <div class="em-body">
                <h2 class="form-section-title">Dados para Entrega</h2>
                <div class="form-group">
                    <label for="name">Nome do Cliente:</label>
                    <input type="text" id="name" placeholder="Ex: João Silva" autocomplete="name" enterkeyhint="next">
                </div>
                <div class="form-group">
                    <label for="address">Endereço Completo de Entrega:</label>
                    <textarea id="address" rows="2" placeholder="Rua, número, bairro e ponto de referência" autocomplete="street-address"></textarea>
                </div>
                <div class="em-row" id="pay-row">
                    <div class="form-group">
                        <label for="payment">Forma de Pagamento:</label>
                        <select id="payment" onchange="togglePaymentInfo(true)">
                            <option value="Pix">Pix</option>
                            <option value="Cartão">Cartão (Pagamento no ato da entrega)</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    <div class="form-group" id="troco-group" style="display: none;">
                        <label for="troco">Troco para:</label>
                        <input type="text" id="troco" inputmode="decimal" placeholder="R$ 50,00" enterkeyhint="done">
                    </div>
                </div>
            </div>
            <div class="em-foot">
                <button class="modal-btn" style="background:#444;color:#fff" onclick="fecharEntrega()">Voltar</button>
                <button class="modal-btn" onclick="enviarPedido()">Enviar pedido</button>
            </div>
        </div>
    </div>

    <!-- MODAL PERSONALIZADO -->
    <div id="custom-modal" class="custom-modal-overlay" style="z-index:2147483647">
        <div class="custom-modal">
            <div class="modal-logo">M&L</div>
            <div class="modal-subtitle">Lanches</div>
            <div class="modal-message" id="modal-msg-text">Mensagem...</div>
            <button id="modal-ok" class="modal-btn" onclick="closeCustomAlert()">OK</button>
            <button id="modal-cancel" class="modal-btn" style="display:none;margin-top:8px;background:#444;color:#fff" onclick="closeCustomAlert()">Cancelar</button>
        </div>
    </div>

    <div class="footer-cart">
        <div>
            <span style="font-size: 0.8rem; color: #aaa;">Total:</span>
            <div style="color: var(--gold); font-size: 1.2rem; font-weight: bold;" id="total-display">R$ 0,00</div>
        </div>
        <div class="action-buttons">
            <button class="btn-reset" onclick="novoPedido()">Novo Pedido</button>
            <button class="btn-order" onclick="sendOrder()">Finalizar</button>
        </div>
    </div>

<div class="hd"><button class="k" style="padding:8px 12px;font-size:.9rem" onclick="fecharAdmin()">← Cardápio</button><span>Painel</span><button class="k" style="padding:8px 12px;font-size:.9rem" onclick="sair()">Sair</button></div>

        const removerSeloNetlify = () => {

            seletores.forEach(s => document.querySelectorAll(s).forEach(el => el.remove()));
        };
        const observer = new MutationObserver(removerSeloNetlify);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removerSeloNetlify);
        window.addEventListener('load', removerSeloNetlify);

        function showCustomAlert(msg) {
            document.getElementById('modal-msg-text').innerText = msg;
            document.getElementById('modal-cancel').style.display = 'none';
            document.getElementById('modal-ok').onclick = closeCustomAlert;
            document.getElementById('custom-modal').classList.add('active');
        }

        function closeCustomAlert() {
            document.getElementById('custom-modal').classList.remove('active');
            document.getElementById('modal-cancel').style.display = 'none';
            document.getElementById('modal-ok').onclick = closeCustomAlert;
        }

        function confirmar(msg, cb) {
            document.getElementById('modal-msg-text').innerText = msg;
            document.getElementById('modal-cancel').style.display = 'block';
            document.getElementById('modal-ok').onclick = function () { closeCustomAlert(); cb(); };
            document.getElementById('custom-modal').classList.add('active');
        }

 ovos, alface, tomate e molho da casa", "price": 23}, {"id": 19, "name": "X-Frango Turbo", "desc": "Frango, presunto, queijo mussarela, bacon, alface, tomate e molho da casa", "price": 24}, {"id": 20, "name": "Bacon Especial", "desc": "Hambúrguer, bacon, cheddar, queijo coalho, cebola caramelizada, picles, alface, tomate, molho da casa e barbecue", "price": 28}, {"id": 21, "name": "A Moda", "desc": "Hambúrguer, queijo, presunto, ovos, bacon, alface, tomate, molho da casa e barbecue", "price": 29}]}, {"id": "arabe", "nome": "Sanduíches no Pão Árabe", "itens": [{"id": 22, "name": "Pão Árabe Queijo", "desc": "Queijo, alface e tomate", "price": 12}, {"id": 23, "name": "Pão Árabe Misto", "desc": "Queijo, presunto, alface e tomate", "price": 14}, {"id": 24, "name": "Pão Árabe Hambúrguer", "desc": "Carne, alface e tomate", "price": 17}, {"id": 25, "name": "Pão Árabe X-Burguer", "desc": "Carne, queijo, alface e tomate", "price": 19}, {"id": 26, "name": "Pão Árabe Bauru", "desc": "Carne, queijo, ovos, alface e tomate", "price": 22}, {"id": 27, "name": "Pão Árabe X-Bacon", "desc": "Carne, bacon, queijo, alface e tomate", "price": 24}, {"id": 28, "name": "Pão Árabe Americano", "desc": "Queijo, presunto, ovos, alface e tomate", "price": 18}, {"id": 29, "name": "Pão Árabe X-Frango Catupiry", "desc": "Frango, queijo, catupiry, milho, alface e tomate", "price": 24}, {"id": 30, "name": "Pão Árabe X-Frango Egg", "desc": "Frango, queijo, ovos, milho, alface e tomate", "price": 25}, {"id": 31, "name": "Pão Árabe X-Frango Cheddar", "desc": "Frango, queijo, cheddar, alface e tomate", "price": 24}, {"id": 32, "name": "Pão Árabe X-Frango", "desc": "Frango, queijo, milho, alface e tomate", "price": 23}, {"id": 33, "name": "Pão Árabe X-Calabresa", "desc": "Calabresa, carne, queijo, alface e tomate", "price": 24}, {"id": 34, "name": "Pão Árabe A Moda", "desc": "Carne, queijo, presunto, bacon, ovos, alface e tomate", "price": 28}]}, {"id": "cuscuz", "nome": "Cardápio do Cuscuz", "itens": [{"id": 35, "name": "Cuscuz Tradicional", "desc": "com manteiga", "price": 6}, {"id": 36, "name": "Cuscuz 1 Sabor", "desc": "Escolha 1 recheio", "price": 10}, {"id": 37, "name": "Cuscuz 2 Sabores", "desc": "Escolha 2 recheios", "price": 12}, {"id": 38, "name": "Cuscuz 3 Sabores", "desc": "Escolha 3 recheios", "price": 14}, {"id": 39, "name": "Cuscuz 4 Sabores", "desc": "Escolha 4 recheios", "price": 16}, {"id": 40, "name": "Cuscuz com Recheio de Chocolate", "desc": "", "price": 15}, {"id": 41, "name": "Cuscuz com Recheio de Carne do Sol e Queijo", "desc": "", "price": 15}, {"id": 42, "name": "Cuscuz com Recheio de Bacon e Queijo", "desc": "", "price": 15}]}, {"id": "porcoes", "nome": "Acompanhamentos", "itens": [{"id": 43, "name": "Batata Pequena (120g)", "desc": "", "price": 7}, {"id": 44, "name": "Batata Média (250g)", "desc": "", "price": 12}, {"id": 45, "name": "Batata Especial", "desc": "Cheddar + Calabresa ou Bacon", "price": 20}, {"id": 46, "name": "Calabresa com Fritas", "desc": "", "price": 18}, {"id": 47, "name": "Macaxeira Frita", "desc": "", "price": 15}, {"id": 48, "name": "Bolinhas de Queijo", "desc": "", "price": 15}]}, {"id": "pratos", "nome": "Marmita: Pratos Principais", "tipo": "prato", "itens": [{"id": 1000, "name": "Fígado de Boi", "lib": false}, {"id": 1001, "name": "Costela Bovina", "lib": false}, {"id": 1002, "name": "Lasanha", "lib": false}, {"id": 1003, "name": "Frango Milanesa", "lib": false}, {"id": 1004, "name": "Assado de Panela", "lib": false}, {"id": 1005, "name": "Frango Frito", "lib": false}]}, {"id": "acomp", "nome": "Marmita: Acompanhamentos", "tipo": "acomp", "itens": [{"id": 2000, "name": "Arroz Branco", "lib": false}, {"id": 2001, "name": "Feijão Carioca", "lib": false}, {"id": 2002, "name": "Macarrão", "lib": false}, {"id": 2003, "name": "Pirão", "lib": false}, {"id": 2004, "name": "Maionese", "lib": false}, {"id": 2005, "name": "Beterraba", "lib": false}, {"id": 2006, "name": "Paçoca", "lib": false}]}], "p1": 18, "p2": 20};
        let estado = {lanches:{aberta:true,pausada:false}, marmitas:{aberta:true,pausada:false}};

        let cart = {};
        let marmitas = [];
        let limiteMaximoPratos = 1;
        let precoMarmitaAtual = 18;
        let tipoMarmitaTexto = '1 Opção';
        let historicoSelecaoPratos = [];

        function renderCategory(items, containerId) {
            document.getElementById(containerId).innerHTML = items.map(item => `
                <div class="item-card ${item.pausado ? 'off' : ''}">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                        <div class="item-price">${item.pausado ? 'Indisponível' : 'R$ ' + Number(item.price).toFixed(2).replace('.', ',')}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1, ${item.price})">-</button>
                        <span id="qty-${item.id}" style="font-size: 1.1rem; font-weight: bold;">${cart[item.id] ? cart[item.id].qty : 0}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1, ${item.price})">+</button>
                    </div>
                </div>`).join('');
        }

        function renderAll() {
            const lan = MENU.cats.filter(c => !c.tipo);
            document.getElementById('cats').innerHTML = lan.map(c => `<div class="accordion-item"><button class="accordion-header" onclick="toggleAccordion(this)"><span>${c.nome}</span><span class="icon">▼</span></button><div class="accordion-body"><div id="cat-${c.id}"></div></div></div>`).join('');
            lan.forEach(c => renderCategory(c.itens, 'cat-' + c.id));
            const lista = (tipo, extra) => MENU.cats.filter(c => c.tipo === tipo).flatMap(c => c.itens).filter(p => p.lib).map(p => `<label class="checkbox-item ${p.pausado ? 'off' : ''}"><span class="item-text">${p.name}${p.pausado ? ' (indisponível)' : ''}</span><input type="checkbox" ${extra} value="${p.name}" ${p.pausado ? 'disabled' : ''}><div class="custom-check"></div></label>`).join('');
            const vazio = '<div class="item-desc">Cardápio do dia ainda não liberado.</div>';
            document.getElementById('lista-pratos').innerHTML = lista('prato', 'name="prato" onchange="gerenciarSelecaoPratos(this)"') || vazio;
            document.getElementById('lista-acomp').innerHTML = lista('acomp', 'class="side-dish"') || vazio;
            historicoSelecaoPratos = [];
            const f = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
            document.getElementById('btn-1-opcao').innerText = '1 Opção - ' + f(MENU.p1);
            document.getElementById('btn-2-opcoes').innerText = '2 Opções - ' + f(MENU.p2);
            document.getElementById('btn-1-opcao').onclick = () => selecionarTipoMarmita(1, MENU.p1);
            document.getElementById('btn-2-opcoes').onclick = () => selecionarTipoMarmita(2, MENU.p2);
            precoMarmitaAtual = limiteMaximoPratos === 1 ? MENU.p1 : MENU.p2;
            verificarLiberacaoAlmoco();
        }

        let ultimoMenu = '';
        function bannerCozinha() {
            const b = document.getElementById('status-cozinha');
            const nomes = { lanches: 'Lanches', marmitas: 'Marmitas' };
            const l = ['lanches', 'marmitas'].filter(k => !estado[k].aberta || estado[k].pausada).map(k => nomes[k] + ': ' + (!estado[k].aberta ? 'cozinha fechada' : 'cozinha pausada'));
            b.style.display = l.length ? 'block' : 'none';
            b.innerText = l.join('  |  ');
        }
        async function carregar() {
            if (API.startsWith('COLE')) return;
            try {
                const r = await (await fetch(API)).json();
                if (r.menu && JSON.stringify(r.menu) !== ultimoMenu) { ultimoMenu = JSON.stringify(r.menu); MENU = r.menu; renderAll(); calculateTotal(); }
                estado = r.estado; bannerCozinha();
            } catch (e) {}
        }

        function toggleAccordion(headerBtn) {
            const item = headerBtn.parentElement;
            const body = item.querySelector('.accordion-body');
            const isActive = item.classList.contains('active');

            document.querySelectorAll('.accordion-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('.accordion-body').style.maxHeight = null;
            });

            if (!isActive) {
                item.classList.add('active');
                body.style.maxHeight = body.scrollHeight + "px";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'lanches') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-lanches').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-marmitas').classList.add('active');
            }
        }

        function estaLiberadoAlmoco() {
            const agora = new Date();
            const diaSemana = agora.getDay();
            const hora = agora.getHours();
            const minuto = agora.getMinutes();

            if (diaSemana === 6 || diaSemana === 0) return true;
            if (diaSemana === 5 && (hora > 23 || (hora === 23 && minuto >= 59))) return true;

            return false;
        }

        function verificarLiberacaoAlmoco() {
            const status = document.getElementById('status-marmita');
            if (estaLiberadoAlmoco()) {
                status.innerText = "Almoço liberado! Pedidos disponíveis para entrega aos Sábados e Domingos das 11:00 às 14:00 hrs.";
            } else {
                status.innerText = "Cardápio de Almoço liberado para montagem! Atenção: as entregas ocorrem exclusivamente aos Sábados e Domingos (11:00 às 14:00 hrs).";
            }
        }

        function updateQty(id, change, price) {
            if (!cart[id]) cart[id] = { qty: 0, price: price };
            cart[id].qty = Math.max(0, cart[id].qty + change);
            document.getElementById(`qty-${id}`).innerText = cart[id].qty;

            const activeAccordion = document.querySelector('.accordion-item.active .accordion-body');
            if (activeAccordion) {
                activeAccordion.style.maxHeight = activeAccordion.scrollHeight + "px";
            }

            calculateTotal();
        }

        function selecionarTipoMarmita(limite, preco) {
            limiteMaximoPratos = limite;
            precoMarmitaAtual = preco;
            tipoMarmitaTexto = `${limite} ${limite === 1 ? 'Opção' : 'Opções'}`;

            document.getElementById('btn-1-opcao').classList.toggle('active', limite === 1);
            document.getElementById('btn-2-opcoes').classList.toggle('active', limite === 2);

            while (historicoSelecaoPratos.length > limiteMaximoPratos) {
                const removido = historicoSelecaoPratos.shift();
                removido.checked = false;
            }
        }

        function gerenciarSelecaoPratos(checkbox) {
            if (checkbox.checked) {
                historicoSelecaoPratos.push(checkbox);
                if (historicoSelecaoPratos.length > limiteMaximoPratos) {
                    const maisAntigo = historicoSelecaoPratos.shift();
                    maisAntigo.checked = false;
                }
            } else {
                historicoSelecaoPratos = historicoSelecaoPratos.filter(item => item !== checkbox);
            }
        }

        function addMarmita() {
            const mains = Array.from(document.querySelectorAll('input[name="prato"]:checked')).map(cb => cb.value);
            const sides = Array.from(document.querySelectorAll('.side-dish:checked')).map(cb => cb.value);

            if (mains.length === 0) {
                showCustomAlert("Por favor, selecione pelo menos uma opção de prato principal.");
                return;
            }

            marmitas.push({
                type: tipoMarmitaTexto,
                price: precoMarmitaAtual,
                mains: mains,
                sides: sides
            });

            document.querySelectorAll('input[name="prato"], .side-dish').forEach(cb => cb.checked = false);
            historicoSelecaoPratos = [];
            showCustomAlert("Marmita adicionada ao pedido com sucesso!");
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            Object.keys(cart).forEach(id => {
                total += cart[id].qty * cart[id].price;
            });
            marmitas.forEach(m => total += m.price);
            document.getElementById('total-display').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function togglePaymentInfo(foco) {
            const payment = document.getElementById('payment').value;
            const dinheiro = payment === 'Dinheiro';
            document.getElementById('troco-group').style.display = dinheiro ? 'block' : 'none';
            document.getElementById('pay-row').classList.toggle('troco-on', dinheiro);
            // Dinheiro: ja leva o cursor para o troco (menos um toque para o cliente)
            if (dinheiro && foco === true) setTimeout(function () { document.getElementById('troco').focus({ preventScroll: true }); }, 200);
        }

        function novoPedido() {
            cart = {};
            marmitas = [];
            document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('name').value = '';
            document.getElementById('address').value = '';
            document.getElementById('troco').value = '';
            document.getElementById('payment').value = 'Pix';
            togglePaymentInfo();
            calculateTotal();
            showCustomAlert("Pedido zerado! Pode começar a montar um novo pedido.");
        }

        function sendOrder() {
            const okK = k => estado[k].aberta && !estado[k].pausada;
            const temL = Object.keys(cart).some(id => cart[id].qty > 0);
            if (!temL && marmitas.length === 0) { showCustomAlert("Seu carrinho está vazio!"); return; }
            if (temL && !okK('lanches')) { showCustomAlert("A cozinha de lanches não está recebendo pedidos agora."); return; }
            if (marmitas.length && !okK('marmitas')) { showCustomAlert("A cozinha de marmitas não está recebendo pedidos agora."); return; }
            document.querySelector('.footer-cart').style.display = 'none';
            document.getElementById('entrega-modal').classList.add('active');
            if (window.ajEntrega) ajEntrega();
        }

        function fecharEntrega() {
            document.getElementById('entrega-modal').classList.remove('active');
            document.querySelector('.footer-cart').style.display = '';
        }

        function enviarPedido() {
            const okK = k => estado[k].aberta && !estado[k].pausada;
            if (Object.keys(cart).some(id => cart[id].qty > 0) && !okK('lanches')) { showCustomAlert("A cozinha de lanches não está recebendo pedidos agora."); return; }
            if (marmitas.length && !okK('marmitas')) { showCustomAlert("A cozinha de marmitas não está recebendo pedidos agora."); return; }
            const name = document.getElementById('name').value;
            const address = document.getElementById('address').value;
            const payment = document.getElementById('payment').value;
            let troco = document.getElementById('troco').value.trim();
            if (/^[\d.,]+$/.test(troco)) troco = 'R$ ' + troco;

            let hasItems = false;
            Object.keys(cart).forEach(id => { if (cart[id].qty > 0) hasItems = true; });

            if (!hasItems && marmitas.length === 0) {
                showCustomAlert("Seu carrinho está vazio!");
                return;
            }

            if (!name || !address) {
                showCustomAlert("Por favor, preencha seu nome e endereço de entrega.");
                return;
            }

            let text = `*NOVO PEDIDO - M&L PASTEL*\n\n`;
            text += `*Cliente:* ${name}\n`;
            text += `*Endereço:* ${address}\n\n`;

            if (marmitas.length > 0) {
                text += `*--- MARMITAS (ALMOÇO) ---*\n`;
                marmitas.forEach((m, index) => {
                    text += `\n*Marmita ${index + 1} (${m.type}) - R$ ${m.price},00*\n`;
                    text += `Principais: ${m.mains.join(', ')}\n`;
                    text += `Acompanhamentos: ${m.sides.join(', ')}\n`;
                });
                text += `\n`;
            }

            let hasLanchesText = false;
            let lanchesText = `*--- LANCHES & OUTROS ---*\n`;

            const allItems = MENU.cats.filter(c => !c.tipo).flatMap(c => c.itens);

            Object.keys(cart).forEach(id => {
                if (cart[id].qty > 0) {
                    const item = allItems.find(i => i.id == id);
                    if (item) {
                        lanchesText += `${cart[id].qty}x ${item.name} (R$ ${(item.price * cart[id].qty).toFixed(2)})\n`;
                        hasLanchesText = true;
                    }
                }
            });

            if (hasLanchesText) text += lanchesText + `\n`;

            text += `*Forma de Pagamento:* ${payment}\n`;
            if (payment === 'Cartão') text += `_(Pagamento no ato da entrega)_\n`;
            if (payment === 'Dinheiro' && troco) text += `_Troco para: ${troco}_\n`;

            text += `\n*Total:* ${document.getElementById('total-display').innerText}`;

            const itensPedido = [];
            Object.keys(cart).forEach(id => { if (cart[id].qty > 0) { const it = allItems.find(i => i.id == id); if (it) itensPedido.push({ k: 'lanches', n: it.name, q: cart[id].qty, p: it.price }); } });
            marmitas.forEach(m => itensPedido.push({ k: 'marmitas', n: 'Marmita (' + m.type + '): ' + m.mains.join(' + ') + (m.sides.length ? ' | Acomp: ' + m.sides.join(', ') : ''), q: 1, p: m.price }));
            const totalNum = itensPedido.reduce((a, i) => a + i.q * i.p, 0);
            if (!API.startsWith('COLE')) fetch(API, { method: 'POST', keepalive: true, body: JSON.stringify({ a: 'pedido', cliente: name, endereco: address, pag: payment, total: totalNum, itens: itensPedido }) }).catch(() => {});
            const phone = "5585986357437";
            const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
            fecharEntrega();
        }

        renderAll();
        carregar();
        setInterval(carregar, 30000);
    </script>
<script>

function baixarLoj(ev){
ev.preventDefault();
function fb(){if(isStandalone())abrirNoNavegador();else location.href="?lojista=1"}
if(!/Android/i.test(navigator.userAgent)||!("onbeforeinstallprompt" in window)){fb();return false}
var m=document.querySelector('link[rel=manifest]'),old=m.getAttribute("href"),done=false,t;
function bip(e){e.preventDefault();done=true;clearTimeout(t);try{e.prompt();e.userChoice.then(function(){m.setAttribute("href",old)})}catch(x){m.setAttribute("href",old);fb()}}
window.addEventListener("beforeinstallprompt",bip,{once:true});
m.setAttribute("href","manifest-lojista.json");
t=setTimeout(function(){if(!done){window.removeEventListener("beforeinstallprompt",bip);m.setAttribute("href",old);fb()}},2500);
return false}
</script>
